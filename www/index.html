<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6B63">
<script src="version.js"></script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Meu Bolso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular numa coluna só (até 640px), barra de abas fixa embaixo.
   O destaque visual é o termômetro do teto, com marcas nos mesmos pontos em que os avisos disparam. */
:root{
  --bg:#EFF3F5; --surface:#FFFFFF; --surface-2:#E4EAEE; --ink:#0F1D26; --muted:#566774;
  --line:#D3DBE1; --accent:#0A6B63; --accent-ink:#FFFFFF; --accent-soft:#D6ECE8; --bar:#B5D6D0;
  --info:#2F5BD8; --info-soft:#DDE5FA; --warn:#9A6208; --warn-soft:#F8E8C6; --warn-fill:#E0A12B;
  --crit:#BE3326; --crit-soft:#F9DAD5; --crit-fill:#D2493B;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#151F26; --surface-2:#1F2C35; --ink:#E7EEF1; --muted:#93A4AF;
    --line:#2A3A45; --accent:#44C4B2; --accent-ink:#052420; --accent-soft:#12332F; --bar:#25524C;
    --info:#8AA6FF; --info-soft:#1C2A52; --warn:#E8B64F; --warn-soft:#3A2D0E; --warn-fill:#D29A2A;
    --crit:#FF8B7E; --crit-soft:#4A1E1A; --crit-fill:#E0594B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#151F26; --surface-2:#1F2C35; --ink:#E7EEF1; --muted:#93A4AF;
  --line:#2A3A45; --accent:#44C4B2; --accent-ink:#052420; --accent-soft:#12332F; --bar:#25524C;
  --info:#8AA6FF; --info-soft:#1C2A52; --warn:#E8B64F; --warn-soft:#3A2D0E; --warn-fill:#D29A2A;
  --crit:#FF8B7E; --crit-soft:#4A1E1A; --crit-fill:#E0594B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.shell{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.status{font-size:12px;color:var(--muted);text-align:right}
.status.err{color:var(--crit)}
/* aviso de nova versão */
.upd{background:var(--info-soft);border:1px solid var(--info);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.upd .eyebrow{color:var(--info)}
.upd-name{font-weight:600}
.upd-notes{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.upd-actions{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none}
main{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{color:var(--muted);font-size:13px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:focus-visible,.chip input:focus-visible+span,.hit:focus-visible,.tab:focus-visible,.cardrow:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.legend{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.chip input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.swatches{display:flex;gap:10px;margin-top:6px}
.swatch{position:relative;width:38px;height:38px}
.swatch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.swatch span{display:block;width:100%;height:100%;border-radius:10px;border:2px solid transparent}
.swatch input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.swatch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--crit);font-size:13px;font-weight:500}
/* seletor de data próprio (substitui o diálogo nativo do Android) */
.datebtn{display:flex;align-items:center;gap:10px;text-align:left}
.datebtn svg{color:var(--accent);flex:none}
.datebtn .dv{display:inline-block}
.datebtn .dv::first-letter{text-transform:uppercase}
.cal{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--font-display);font-size:16px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-day{min-height:40px;border:0;border-radius:10px;background:none;font-variant-numeric:tabular-nums}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.cal-day.sel{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none}
.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-quick{display:flex;gap:8px;margin-top:10px}

/* navegação de mês */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{text-align:center;flex:1}

/* termômetro */
.gauge{padding:18px 16px 16px}
.gauge-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.big{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.02em;margin-top:4px}
.pctbadge{font-family:var(--font-display);font-weight:700;font-size:20px;padding:6px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.pctbadge.l1,.pctbadge.l2{background:var(--warn-soft);color:var(--warn)}
.pctbadge.l3,.pctbadge.l4,.pctbadge.l5,.pctbadge.l6{background:var(--crit-soft);color:var(--crit)}
.track{position:relative;height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:16px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:8px 0 0 8px}
.fill.l1,.fill.l2{background:var(--warn-fill)}
.fill.l3,.fill.l4,.fill.l5,.fill.l6{background:var(--crit-fill)}
.tick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface)}
.tick.cap{width:3px;margin-left:-1.5px;background:var(--ink)}
.scale{position:relative;height:20px;margin-top:6px;font-size:11px;color:var(--muted)}
.scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.scale span.end{transform:translateX(-100%)}
.scale span.capl{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{min-width:0}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat .v.bad{color:var(--crit)}
.stat .k{font-size:12px;color:var(--muted);line-height:1.3}
.capline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}

/* avisos */
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--info-soft)}
.alert.warn{background:var(--warn-soft)}
.alert.crit{background:var(--crit-soft)}
.alert .tag{font-family:var(--font-display);font-weight:700;font-size:13px;padding:2px 8px;border-radius:8px;background:var(--surface);color:var(--info);min-width:46px;text-align:center}
.alert.warn .tag{color:var(--warn)}
.alert.crit .tag{color:var(--crit)}
.alert b{display:block;font-size:14px}
.alert p{font-size:13.5px}
.alert .novo{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--crit)}

/* listas */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);grid-column:1}
.item .val{font-weight:600;text-align:right}
.item .act{grid-column:2;text-align:right}
.split{display:flex;flex-direction:column;gap:12px}
.split-row .top2{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.split-row .bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.split-row .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--info-soft);color:var(--ink);font-size:14px}
.empty{padding:18px 4px;text-align:center;color:var(--muted)}

/* prévia no lançamento */
.preview{padding:12px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.pv-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mini{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.mini .a{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.55}
.mini .b{position:absolute;top:0;bottom:0;background:var(--crit-fill)}
.mini .t100{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.pv-warn{color:var(--crit);font-weight:600;font-size:13.5px}
.pv-ok{color:var(--accent);font-weight:600;font-size:13.5px}

/* cartões */
.cardrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.plastic{width:52px;height:36px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px}
.cardrow .nm{font-weight:600;font-size:16px}
.limitbar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.limitbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.limitbar i.hi{background:var(--warn-fill)}
.limitbar i.over{background:var(--crit-fill)}
.cardhead{display:flex;align-items:center;gap:12px}
.chart-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.chart-scroll svg{display:block}
.ax{fill:var(--muted);font-family:var(--font-body);font-size:10px}
.ax.cur{fill:var(--accent);font-weight:700}
.vl{fill:var(--ink);font-family:var(--font-body);font-size:10px}
.grid{stroke:var(--line);stroke-width:1}
.bar-r{fill:var(--bar)}
.bar-r.sel{fill:var(--accent)}
.hit{fill:transparent;cursor:pointer}

/* abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent)}

/* diálogo e aviso rápido */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,12,16,.55);display:grid;align-items:end;justify-items:center;padding:0 12px max(12px,env(safe-area-inset-bottom,0px))}
.dialog{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog.crit{border-color:var(--crit)}
.dialog.warn{border-color:var(--warn-fill)}
.dialog-actions{display:flex;gap:10px;flex-wrap:wrap}
.dialog-actions .btn{flex:1 1 140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .fill{transition:width .5s ease}
  .toast{animation:up .2s ease-out}
  @keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
@media (max-width:380px){.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.big{font-size:30px}}

/* abas (5) */
.tabbar-in{grid-template-columns:repeat(5,1fr)}
.tab{font-size:11px;padding-inline:2px}
/* valores e marcações */
.pos{color:var(--accent)}
.bad{color:var(--crit)}
.bigval{font-family:var(--font-display);font-size:24px;font-weight:700;min-height:54px}
.pill{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.03em;vertical-align:2px;background:var(--surface-2);color:var(--muted)}
.pill.need{background:var(--info-soft);color:var(--info)}
.pill.want{background:var(--warn-soft);color:var(--warn)}
.item .acts{grid-column:2;display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.danger-link{color:var(--crit)}
.due-soon{color:var(--crit);font-weight:600}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--crit)}
.delta.down{color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;min-height:40px;font-size:14px;font-weight:500}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
/* necessidade x desejo */
.nw{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nw-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.nw-bar i{display:block;height:100%}
.nw-bar .need,.dot.need{background:var(--info)}
.nw-bar .want,.dot.want{background:var(--warn-fill)}
.dot.need,.dot.want{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:0}
/* lista de espera e faturas */
.wish{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.wish:first-of-type{border-top:0;padding-top:0}
.saved{padding:12px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:10px}
.invstate{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:6px 0 4px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
.invstate.paid{background:var(--accent-soft);color:var(--accent)}
@media (max-width:360px){.tab{font-size:10px}}
</style>

</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Meu Bolso</div>
    <div class="status" id="status"></div>
  </header>
  <div class="upd" id="upd" role="status" hidden></div>
  <main id="view"></main>
</div>
<nav class="tabbar" aria-label="Seções">
  <div class="tabbar-in">
    <button class="tab" data-tab="home" data-act="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a8 8 0 1 1 16 0"/><path d="M12 14l4-4"/><path d="M4 14h2M18 14h2"/></svg>
      Início
    </button>
    <button class="tab" data-tab="add" data-act="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Lançar
    </button>
    <button class="tab" data-tab="income" data-act="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
      Entradas
    </button>
    <button class="tab" data-tab="cards" data-act="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
      Cartões
    </button>
    <button class="tab" data-tab="more" data-act="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      Mais
    </button>
  </div>
</nav>
<input type="file" id="imp-file" accept=".json,application/json,text/plain" hidden>
<div id="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
<script>
/* Aviso de atualização: compara a versão instalada com a última release do GitHub. */
(function(){
  var REPO='Rogrinhu/Meu_Bolso', KEY='mb_upd_ignorada', box=document.getElementById('upd');
  var atual=window.APP_VERSION;
  if(!atual||!box||!window.fetch) return;
  function partes(v){return String(v).replace(/^v/,'').split('.').map(function(n){return parseInt(n,10)||0})}
  function maior(a,b){a=partes(a);b=partes(b);for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x>y}return false}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var ultima=0;
  function checar(){
    if(Date.now()-ultima<15*60*1000) return;
    ultima=Date.now();
    fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'})
      .then(function(r){return r.ok?r.json():null})
      .then(function(rel){
        if(!rel||!rel.tag_name||!maior(rel.tag_name,atual)) return;
        var ign=null; try{ign=localStorage.getItem(KEY)}catch(e){}
        if(ign===rel.tag_name) return;
        var apk=(rel.assets||[]).filter(function(a){return /\.apk$/i.test(a.name)})[0];
        var link=apk?apk.browser_download_url:rel.html_url;
        var notas=(rel.body||'').split(String.fromCharCode(10)).filter(function(l){return /^\s*[-*]\s+/.test(l)})
          .map(function(l){return l.replace(/^\s*[-*]\s+/,'').trim()}).slice(0,4);
        box.innerHTML='<span class="eyebrow">Nova versão '+esc(rel.tag_name.replace(/^v/,''))+'</span>'+
          '<p class="upd-name">'+esc(rel.name||rel.tag_name)+'</p>'+
          (notas.length?'<ul class="upd-notes">'+notas.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul>':'')+
          '<div class="upd-actions"><a class="btn primary sm" href="'+esc(link)+'">Baixar atualização</a>'+
          '<button class="btn sm" type="button" id="upd-depois">Agora não</button></div>';
        box.hidden=false;
        document.getElementById('upd-depois').onclick=function(){try{localStorage.setItem(KEY,rel.tag_name)}catch(e){} box.hidden=true};
      })
      .catch(function(){});
  }
  checar();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checar()});
})();
</script>
</body>
</html>

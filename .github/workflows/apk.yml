name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # só gera versão quando muda algo do app (README, scripts etc. não disparam)
    paths:
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Gravar versão no app
        run: echo "window.APP_VERSION = \"$VERSION_NAME\";" > www/version.js

      - name: Sincronizar projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Assinando com a chave fixa."
          else
            echo "::warning::Segredo ANDROID_KEYSTORE_BASE64 não configurado. O APK sai com chave de debug aleatória e não instala por cima da versão anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MeuBolso.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v7
        with:
          name: meu-bolso-apk
          path: MeuBolso.apk

      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "feat: adiciona X" -> "Adiciona X"
          limpa() { sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//; s/^(.)/\U\1/'; }

          titulo=$(git log -1 --format=%s | limpa)
          anterior=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$anterior" ]; then faixa="$anterior..HEAD"; else faixa="-20 HEAD"; fi
          mudancas=$(git log $faixa --no-merges --format=%s | limpa)

          {
            echo "Versão $VERSION_NAME"
            if [ "$(printf '%s\n' "$mudancas" | grep -c .)" -gt 1 ]; then
              echo
              echo "O que mudou:"
              printf '%s\n' "$mudancas" | sed 's/^/- /'
            fi
          } > notas.md
          cat notas.md

          # "Re-run" reaproveita o run_number: se a versão já existe, só troca o APK
          if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
            echo "A versão v$VERSION_NAME já existe (re-run): atualizando o APK."
            gh release upload "v$VERSION_NAME" MeuBolso.apk --clobber
          else
            gh release create "v$VERSION_NAME" MeuBolso.apk \
              --target "$GITHUB_SHA" --title "$titulo" --notes-file notas.md --latest
          fi
